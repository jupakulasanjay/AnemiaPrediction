<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Venture Plus — Corporate Travel Desk</title>
<style>
:root {
  --navy: #0f2744;
  --navy-light: #1a365d;
  --blue: #2563eb;
  --blue-soft: #dbeafe;
  --green: #059669;
  --green-bg: #d1fae5;
  --red: #dc2626;
  --amber: #d97706;
  --amber-bg: #fef3c7;
  --grey: #64748b;
  --grey-light: #f1f5f9;
  --border: #e2e8f0;
  --white: #ffffff;
  --shadow: 0 4px 24px rgba(15,39,68,.08);
  --radius: 12px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: linear-gradient(135deg, #f0f4f8 0%, #e2e8f0 100%); min-height: 100vh; color: #1e293b; }
.hidden { display: none !important; }

/* Login */
#login-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
.login-card { background: var(--white); border-radius: 16px; box-shadow: var(--shadow); padding: 48px 40px; width: 100%; max-width: 420px; text-align: center; }
.login-logo { width: 64px; height: 64px; background: var(--navy); border-radius: 16px; margin: 0 auto 20px; display: flex; align-items: center; justify-content: center; color: white; font-weight: 700; font-size: 18px; }
.login-card h1 { font-size: 1.5rem; color: var(--navy); margin-bottom: 4px; }
.login-card .subtitle { color: var(--grey); font-size: 14px; margin-bottom: 32px; }
.form-group { text-align: left; margin-bottom: 20px; }
.form-group label { display: block; font-size: 13px; font-weight: 600; color: var(--navy-light); margin-bottom: 8px; }
.form-group select { width: 100%; padding: 12px 14px; border: 1px solid var(--border); border-radius: 8px; font-size: 15px; background: var(--white); }
.btn { padding: 12px 24px; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all .2s; }
.btn-primary { background: var(--blue); color: white; width: 100%; }
.btn-primary:hover { background: #1d4ed8; }
.btn-secondary { background: var(--grey-light); color: var(--navy); }
.btn-success { background: var(--green); color: white; }
.btn-warning { background: var(--amber); color: white; }
.btn-sm { padding: 8px 16px; font-size: 13px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }

/* App shell */
#app { min-height: 100vh; display: flex; flex-direction: column; }
.topbar { background: var(--navy); color: white; padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 2px 12px rgba(0,0,0,.15); }
.topbar-brand { display: flex; align-items: center; gap: 12px; }
.topbar-logo { width: 36px; height: 36px; background: rgba(255,255,255,.15); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 12px; }
.topbar h1 { font-size: 1.1rem; font-weight: 600; }
.topbar .client { font-size: 12px; opacity: .75; }
.topbar-user { display: flex; align-items: center; gap: 16px; font-size: 14px; }
.role-badge { background: rgba(255,255,255,.2); padding: 4px 12px; border-radius: 20px; font-size: 12px; }
.main { flex: 1; padding: 24px; max-width: 1280px; margin: 0 auto; width: 100%; }

/* Stats */
.stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 24px; }
.stat-card { background: white; border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); }
.stat-card .label { font-size: 12px; color: var(--grey); text-transform: uppercase; letter-spacing: .5px; }
.stat-card .value { font-size: 28px; font-weight: 700; color: var(--navy); margin-top: 4px; }

/* Cards & tables */
.card { background: white; border-radius: var(--radius); box-shadow: var(--shadow); margin-bottom: 24px; overflow: hidden; }
.card-header { padding: 18px 24px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
.card-header h2 { font-size: 1.1rem; color: var(--navy); }
.card-body { padding: 24px; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { padding: 12px 14px; text-align: left; border-bottom: 1px solid var(--border); }
th { background: var(--grey-light); font-weight: 600; color: var(--navy-light); font-size: 12px; text-transform: uppercase; letter-spacing: .3px; }
tr:hover td { background: #fafbfc; }
.clickable-row { cursor: pointer; }
.clickable-row:hover td { background: var(--blue-soft) !important; }

/* Status badges */
.badge { display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; text-transform: uppercase; }
.badge-draft { background: #e2e8f0; color: #475569; }
.badge-quoting { background: #dbeafe; color: #1d4ed8; }
.badge-pending-chris { background: var(--amber-bg); color: var(--amber); }
.badge-approved { background: var(--green-bg); color: var(--green); }
.badge-locked { background: #fee2e2; color: var(--red); }
.badge-confirmed { background: #d1fae5; color: #047857; }
.badge-urgent { background: #fecaca; color: #b91c1c; }

/* Forms */
.form-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }
.form-field label { display: block; font-size: 12px; font-weight: 600; color: var(--navy-light); margin-bottom: 6px; }
.form-field input, .form-field select, .form-field textarea {
  width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px;
}
.form-field textarea { min-height: 72px; resize: vertical; }
.form-field.full { grid-column: 1 / -1; }

/* Matrix table */
.matrix-wrap { overflow-x: auto; margin: 16px 0; }
.matrix-table { min-width: 700px; }
.matrix-table th.flight-col { text-align: center; min-width: 140px; }
.matrix-table th.flight-col small { display: block; color: var(--grey); font-weight: 400; font-size: 11px; margin-top: 4px; }
.matrix-table td.agency-name { font-weight: 600; background: var(--grey-light); white-space: nowrap; }
.matrix-cell { text-align: center; cursor: pointer; transition: all .15s; position: relative; }
.matrix-cell:hover { background: var(--blue-soft); }
.matrix-cell.selected { background: #bfdbfe; outline: 2px solid var(--blue); }
.matrix-cell .price { font-weight: 700; font-size: 15px; color: var(--navy); }
.matrix-cell .airline { font-size: 11px; color: var(--grey); margin-top: 2px; }
.matrix-cell.within-budget { }
.matrix-cell.over-budget .price { color: var(--red); }
.matrix-cell.within-budget .price { color: var(--green); }
.matrix-cell input[type=checkbox] { width: 16px; height: 16px; margin-bottom: 4px; cursor: pointer; }
.matrix-price-input { width: 96px; padding: 8px 6px; text-align: center; border: 1px solid var(--border); border-radius: 6px; font-size: 14px; font-weight: 600; }
.matrix-cell.empty-cell { background: #fafafa; }
.matrix-add-panel { text-align: center; padding: 32px 24px; background: var(--grey-light); border-radius: 8px; border: 2px dashed var(--border); }
.matrix-add-panel p { color: var(--grey); margin-bottom: 16px; font-size: 14px; }

/* Governance */
.gov-list { display: grid; gap: 10px; }
.gov-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: var(--grey-light); border-radius: 8px; font-size: 14px; }
.gov-item input[type=checkbox] { width: 18px; height: 18px; cursor: pointer; }
.gov-icon { width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; }
.gov-icon.pass { background: var(--green-bg); color: var(--green); }
.gov-icon.fail { background: #e2e8f0; color: #94a3b8; }
.gov-section-title { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .4px; color: var(--navy-light); margin: 16px 0 8px; padding-bottom: 6px; border-bottom: 1px solid var(--border); }
.gov-section-title:first-child { margin-top: 0; }
.gov-item.required-pending { border-left: 3px solid var(--amber); }
.badge-hr { background: #ede9fe; color: #6d28d9; }

/* Detail layout */
.detail-grid { display: grid; grid-template-columns: 1fr 340px; gap: 24px; }
@media (max-width: 960px) { .detail-grid { grid-template-columns: 1fr; } }
.detail-meta { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 20px; }
.meta-item { background: var(--grey-light); padding: 12px; border-radius: 8px; }
.meta-item .k { font-size: 11px; color: var(--grey); text-transform: uppercase; }
.meta-item .v { font-size: 14px; font-weight: 600; margin-top: 2px; }

.action-bar { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--border); }
.alert { padding: 14px 18px; border-radius: 8px; font-size: 14px; margin-bottom: 16px; }
.alert-info { background: var(--blue-soft); color: #1e40af; border-left: 4px solid var(--blue); }
.alert-warn { background: var(--amber-bg); color: #92400e; border-left: 4px solid var(--amber); }
.alert-success { background: var(--green-bg); color: #065f46; border-left: 4px solid var(--green); }

.tabs { display: flex; gap: 4px; margin-bottom: 20px; border-bottom: 2px solid var(--border); }
.tab { padding: 10px 20px; font-size: 14px; font-weight: 600; color: var(--grey); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -2px; }
.tab.active { color: var(--blue); border-bottom-color: var(--blue); }

.back-link { color: var(--blue); cursor: pointer; font-size: 14px; margin-bottom: 16px; display: inline-flex; align-items: center; gap: 6px; }
.back-link:hover { text-decoration: underline; }

.toast { position: fixed; bottom: 24px; right: 24px; background: var(--navy); color: white; padding: 14px 24px; border-radius: 8px; box-shadow: var(--shadow); z-index: 9999; animation: slideIn .3s ease; }
@keyframes slideIn { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

.empty-state { text-align: center; padding: 48px 24px; color: var(--grey); }

/* Chris — selected options only */
</style>
</head>

function genMatrix(basePrice, spread) {
  const m = {};
  AGENCIES.forEach((ag, ai) => {
    m[ag] = {};
    FLIGHTS.forEach((f, fi) => {
      const variance = (ai * 120) + (fi * 80) + (spread / 2);
      m[ag][f.id] = { price: Math.round(basePrice + variance), airline: f.airline, route: f.route };
    });
  });
  return m;
}

function emptyMatrix() {
  const m = {};
  AGENCIES.forEach(ag => {
    m[ag] = {};
    FLIGHTS.forEach(f => {
      m[ag][f.id] = { price: null, airline: f.airline, route: f.route };
    });
  });
  return m;
}

function initMatrix(ticketId) {

  render();
}

function updateMatrixPrice(ticketId, agency, flightId, value) {
  const t = getTicket(ticketId);
  if (!t?.matrix || isVisaBlocked(t)) return;
  const price = value === '' ? null : parseInt(value, 10);
  t.matrix[agency][flightId].price = Number.isFinite(price) && price > 0 ? price : null;
}

function matrixHasQuotes(ticket) {
  if (!ticket.matrix) return false;
  return AGENCIES.some(ag => FLIGHTS.some(f => ticket.matrix[ag][f.id].price != null));

function ensureGov(t) {
  t.governance = { ...GOV_DEFAULTS, ...t.governance };
  if (!t.trip.visa) {
    t.governance.visaSecured = true;
    t.governance.visaPermitted = true;
    t.governance.visaRequiredDeclared = true;
  } else {
    t.governance.visaRequiredDeclared = true;
    if (!t.governance.visaPermitted) t.governance.visaSecured = false;
  }
}

  const role = document.getElementById('login-user').value;

  const badges = { chris: 'Approver', hr: 'HR — Program Owner', agent: 'Venture+ Agent', sa: 'Super Admin' };

function logout() {

  document.getElementById('login-screen').classList.remove('hidden');
}

function toast(msg) {
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 3000);
}

function getTicket(id) { return tickets.find(t => t.id === id); }

function statusBadge(s) {
  const map = { draft: 'Draft', quoting: 'Quoting', 'pending-chris': 'Pending Chris', approved: 'Approved', locked: 'Visa Locked', confirmed: 'Confirmed' };
  return `<span class="badge badge-${s}">${map[s] || s}</span>`;
}

function govIcon(pass) {
  return pass
    ? '<span class="gov-icon pass" title="Met">✓</span>'
    : '<span class="gov-icon fail" title="Not met">✕</span>';
}

function isOverBand(ticket) {
  return !ticket.governance.withinCostBand || ticket.status === 'pending-chris';
}

function hrVisaChecksComplete(ticket) {
  if (!ticket.trip.visa) return true;
  return ticket.governance.visaDocumentsUploaded
    && ticket.governance.hrNocIssued
    && ticket.governance.hrSalaryCertIssued
    && ticket.governance.visaPermitted;
}

function hrChecksForTicket(ticket) {
  return HR_GOVERNANCE_CHECKS.filter(c => {
    if (c.whenVisa && !ticket.trip.visa) return false;
    if (c.whenOverBand && !isOverBand(ticket)) return false;
    return true;
  });
}

function renderCheckList(checks, ticket, editable, group) {
  return checks.map(g => {
    const val = g.readOnly ? (g.whenVisa ? ticket.trip.visa : true) : ticket.governance[g.id];
    const pending = g.requiredForBooking && ticket.trip.visa && !val;
    const itemCls = pending ? 'gov-item required-pending' : 'gov-item';
    if (editable === true && group === 'hr' && !g.readOnly) {
      return `<label class="${itemCls}"><input type="checkbox" ${val ? 'checked' : ''} onchange="updateGov('${ticket.id}','${g.id}',this.checked)"><span>${g.label}</span></label>`;
    }
    if (editable === 'visa-only' && g.id === 'visaSecured') {
      const canMark = hrVisaChecksComplete(ticket);
      if (!canMark) {
        return `<div class="gov-item" style="opacity:.5;border:2px solid #e2e8f0;background:#f8fafc">${govIcon(false)}<span><strong>${g.label}</strong> — waiting for HR visa permitted</span></div>`;
      }
      return `<label class="gov-item" style="border:2px solid #f59e0b;background:#fffbeb"><input type="checkbox" ${val ? 'checked' : ''} onchange="updateGov('${ticket.id}','${g.id}',this.checked)"><span><strong>${g.label}</strong> — check when ready to unlock booking</span></label>`;
    }
    if (editable === true && group === 'desk') {
      if (g.id === 'visaSecured' && ticket.trip.visa && !hrVisaChecksComplete(ticket)) {
        return `<div class="gov-item" style="opacity:.5">${govIcon(false)}<span>${g.label} — HR must permit visa first</span></div>`;
      }
      return `<label class="${itemCls}"><input type="checkbox" ${val ? 'checked' : ''} onchange="updateGov('${ticket.id}','${g.id}',this.checked)"><span>${g.label}</span></label>`;
    }
    return `<div class="${itemCls}">${govIcon(!!val)}<span>${g.label}${g.readOnly && ticket.trip.visa ? ' — Yes' : ''}</span></div>`;
  }).join('');
}

function renderGovernance(ticket, editable) {
  const deskChecks = GOVERNANCE_CHECKS.filter(c => !c.whenVisa || ticket.trip.visa);
  let html = '<div class="gov-section-title">Travel Desk Checks</div><div class="gov-list">';
  html += renderCheckList(deskChecks, ticket, editable === 'visa-only' ? 'visa-only' : editable, 'desk');
  html += '</div>';
  html += '<div class="gov-section-title">HR — Governance & Oversight (Melissa Payumo)</div><div class="gov-list">';
  html += renderCheckList(hrChecksForTicket(ticket), ticket, false, 'hr');
  html += '</div>';
  return html;
}

function renderHRGovernance(ticket, editable) {
  let html = '<div class="gov-section-title">HR — Governance & Oversight</div><div class="gov-list">';
  html += renderCheckList(hrChecksForTicket(ticket), ticket, editable, 'hr');
  html += '</div>';
  if (ticket.trip.visa) {
    html += '<p style="font-size:12px;color:#64748b;margin-top:12px"><strong>Visa required:</strong> Complete all HR checks including <em>Visa permitted to proceed</em> before the travel desk can add quotes or book.</p>';
  }
  html += '<div class="gov-section-title">Travel Desk Checks (read-only)</div><div class="gov-list">';
  html += renderCheckList(GOVERNANCE_CHECKS.filter(c => !c.whenVisa || ticket.trip.visa), ticket, false, 'desk');
  html += '</div>';
  return html;
}

function updateGov(ticketId, key, val) {
  const t = getTicket(ticketId);
  if (!t) return;
  ensureGov(t);
  if (currentUser.role === 'hr') {
    const hrIds = HR_GOVERNANCE_CHECKS.map(c => c.id);
    if (!hrIds.includes(key)) { toast('HR can only update HR governance checks.'); return; }
  }
  if (currentUser.role === 'agent' && key === 'visaSecured' && t.trip.visa && !hrVisaChecksComplete(t)) {
    toast('HR must complete visa checks and mark Visa permitted before desk can proceed.');
    return;
  }
  t.governance[key] = val;
  if (t.trip.visa && key === 'visaPermitted' && !val) {
    t.governance.visaSecured = false;
    t.status = 'locked';
    t.selectedCells = {};
    t.sharedWithChris = false;
    t.chrisDecision = null;
    toast('Visa not permitted — ticket locked. No booking steps allowed.');
  }
  if (t.trip.visa && key === 'visaSecured') {
    if (val) {
      if (!hrVisaChecksComplete(t)) {
        t.governance.visaSecured = false;
        toast('HR must mark Visa permitted before desk can unlock booking.');
        return;
      }
      t.status = 'quoting';
      toast('Visa secured — agent can now add vendor quotes and proceed with booking.');
    } else {
      t.status = 'locked';
      t.selectedCells = {};
      t.sharedWithChris = false;
      t.chrisDecision = null;
      toast('Visa not secured — ticket locked. No booking steps allowed.');
    }
  }
  if (key === 'visaPermitted' && val && t.trip.visa && t.status === 'locked') {
    toast('HR visa permitted — travel desk may now confirm visa secured and add quotes.');
  }
  render();
}

function isWithinBudget(price, ticket) {
  return price <= ticket.budget.max;
}

function isVisaBlocked(ticket) {
  ensureGov(ticket);
  return ticket.trip.visa && (!ticket.governance.visaPermitted || !ticket.governance.visaSecured);
}

function getSelectedOptions(ticket) {
  if (!ticket.matrix) return [];
  const selections = [];
  AGENCIES.forEach(ag => {
    (ticket.selectedCells[ag] || []).forEach(fid => {
      const cell = ticket.matrix[ag][fid];
      if (!cell || cell.price == null) return;
      const f = FLIGHTS.find(x => x.id === fid);
      selections.push({ agency: ag, flightId: fid, flight: f, cell, price: cell.price });
    });
  });
  return selections;
}

function renderChrisSelectedOptions(ticket) {
  if (!ticket.matrix) {
    return '<p class="empty-state">Agent has not shared any selected options for your review yet.</p>';
  }
  const selections = getSelectedOptions(ticket);
  if (!selections.length) {
    return '<p class="empty-state">Agent has not shared any selected options for your review yet.</p>';
  }
  const selectedFlights = FLIGHTS.filter(f =>
    AGENCIES.some(ag => ticket.selectedCells[ag]?.includes(f.id))
  );
  let html = '<div class="matrix-wrap"><table class="matrix-table"><thead><tr><th>Travel Agency</th>';
  selectedFlights.forEach(f => {
    html += `<th class="flight-col">${f.name}<br><small>${f.time}</small></th>`;
  });
  html += '</tr></thead><tbody>';
  AGENCIES.forEach(ag => {
    const rowHasSelection = selectedFlights.some(f => ticket.selectedCells[ag]?.includes(f.id));
    if (!rowHasSelection) return;
    html += `<tr><td class="agency-name">${ag}</td>`;
    selectedFlights.forEach(f => {
      const sel = ticket.selectedCells[ag]?.includes(f.id);
      if (!sel) {
        html += '<td class="matrix-cell chris-empty"><div class="price" style="color:#94a3b8">—</div></td>';
        return;
      }
      const cell = ticket.matrix[ag][f.id];
      const within = isWithinBudget(cell.price, ticket);
      const cls = `matrix-cell chris-selected ${within ? 'within-budget' : 'over-budget'}`;
      html += `<td class="${cls}">
        <div class="price">AED ${cell.price.toLocaleString()}</div>
        <div class="airline">${cell.airline}</div>
        <span class="budget-tag">${within ? '<span class="badge badge-approved">Within budget</span>' : '<span class="badge badge-pending-chris">Over budget</span>'}</span>
      </td>`;
    });
    html += '</tr>';
  });
  html += '</tbody></table></div>';
  html += `<p style="font-size:12px;color:#64748b;margin-top:12px">Agency × Flight matrix — agent-selected cells only. Full vendor quotes are not shown.</p>`;
  return html;
}

function renderSelectedOptions(ticket) {
  return renderChrisSelectedOptions(ticket);
}

function renderMatrix(ticket, options = {}) {
  if (currentUser?.role === 'chris') return renderChrisSelectedOptions(ticket);
  const { selectable = false, editablePrices = false } = options;
  if (!ticket.matrix) {
    if (isVisaBlocked(ticket)) {
      return '<div class="empty-state" style="padding:24px;background:#fef2f2;border-radius:8px;border:1px solid #fecaca"><strong style="color:#b91c1c">Visa not secured — ticket created only.</strong><br><br>No vendor quotes or booking steps until visa is marked secured.</div>';
    }
    if (editablePrices) {
      return `<div class="matrix-add-panel">
        <p>The agent collects quotes from travel agencies and adds the Agency × Flight price matrix here.</p>
        <button class="btn btn-primary" onclick="initMatrix('${ticket.id}')">+ Add Agency × Flight Price Matrix</button>
      </div>`;
    }
    return '<p class="empty-state">Agent has not added the price matrix yet.</p>';
  }
  let html = '<div class="matrix-wrap"><table class="matrix-table"><thead><tr><th>Travel Agency</th>';
  FLIGHTS.forEach(f => {
    html += `<th class="flight-col">${f.name}<br><small>${f.time}</small></th>`;
  });
  html += '</tr></thead><tbody>';
  AGENCIES.forEach(ag => {
    html += `<tr><td class="agency-name">${ag}</td>`;
    FLIGHTS.forEach(f => {
      const cell = ticket.matrix[ag][f.id];
      const hasPrice = cell.price != null && cell.price > 0;
      const within = hasPrice && isWithinBudget(cell.price, ticket);
      const sel = ticket.selectedCells[ag]?.includes(f.id);
      const cls = `matrix-cell ${!hasPrice ? 'empty-cell' : within ? 'within-budget' : 'over-budget'} ${sel ? 'selected' : ''}`;
      if (editablePrices) {
        html += `<td class="${cls}">
          <input type="number" class="matrix-price-input" min="1" step="1" placeholder="AED" value="${hasPrice ? cell.price : ''}"
            onchange="updateMatrixPrice('${ticket.id}','${ag}','${f.id}',this.value);render()">
          <div class="airline">${cell.airline}</div>
          ${hasPrice && selectable ? `<label style="display:block;margin-top:6px;font-size:11px"><input type="checkbox" ${sel ? 'checked' : ''} onclick="event.stopPropagation();toggleCell('${ticket.id}','${ag}','${f.id}')"> Select</label>` : ''}
        </td>`;
      } else if (selectable && hasPrice) {
        html += `<td class="${cls}" onclick="toggleCell('${ticket.id}','${ag}','${f.id}')">
          <input type="checkbox" ${sel ? 'checked' : ''} onclick="event.stopPropagation();toggleCell('${ticket.id}','${ag}','${f.id}')">
          <div class="price">AED ${cell.price.toLocaleString()}</div>
          <div class="airline">${cell.airline}</div>
        </td>`;
      } else {
        html += `<td class="${cls}">
          ${sel ? '★ ' : ''}${hasPrice ? `<div class="price">AED ${cell.price.toLocaleString()}</div>` : '<div class="price" style="color:#94a3b8">—</div>'}
          <div class="airline">${cell.airline}</div>
        </td>`;
      }
    });
    html += '</tr>';
  });
  html += '</tbody></table></div>';
  return html;
}

function toggleCell(ticketId, agency, flightId) {
  const t = getTicket(ticketId);
  if (!t || currentUser.role !== 'agent' || isVisaBlocked(t) || !t.matrix) return;
  const price = t.matrix[agency][flightId].price;
  if (price == null || price <= 0) return;
  if (!t.selectedCells[agency]) t.selectedCells[agency] = [];
  const arr = t.selectedCells[agency];
  const idx = arr.indexOf(flightId);
  if (idx >= 0) arr.splice(idx, 1);
  else arr.push(flightId);
  if (arr.length === 0) delete t.selectedCells[agency];
  render();
}

function validateSelection(ticket) {
  const colsWithSelection = FLIGHTS.filter(f =>
    AGENCIES.some(ag => ticket.selectedCells[ag]?.includes(f.id))
  );
  if (colsWithSelection.length === 0) return { ok: false, msg: 'Select at least one agency price per flight column you want to share.' };
  return { ok: true, cols: colsWithSelection };
}

function getSelectedPrices(ticket) {
  const prices = [];
  AGENCIES.forEach(ag => {
    (ticket.selectedCells[ag] || []).forEach(fid => {
      prices.push({ agency: ag, flight: fid, price: ticket.matrix[ag][fid].price });
    });
  });
  return prices;
}

function allSelectedWithinBudget(ticket) {
  const prices = getSelectedPrices(ticket);
  if (!prices.length) return false;
  return prices.every(p => isWithinBudget(p.price, ticket));
}

function agentShareWithChris(ticketId) {
  const t = getTicket(ticketId);
  if (isVisaBlocked(t)) { toast('Visa not secured — cannot proceed with booking.'); return; }
  if (!matrixHasQuotes(t)) { toast('Add the Agency × Flight price matrix with vendor quotes first.'); return; }
  const v = validateSelection(t);
  if (!v.ok) { toast(v.msg); return; }
  t.sharedWithChris = true;
  t.status = 'pending-chris';
  t.governance.budgetAligned = allSelectedWithinBudget(t);
  toast('Options shared with Chris for approval.');
  render();
}

function agentConfirmTraveler(ticketId) {
  const t = getTicket(ticketId);
  if (isVisaBlocked(t)) { toast('Visa not secured — cannot proceed with booking.'); return; }
  if (!matrixHasQuotes(t)) { toast('Add the Agency × Flight price matrix with vendor quotes first.'); return; }
  const v = validateSelection(t);
  if (!v.ok) { toast(v.msg); return; }
  if (!allSelectedWithinBudget(t)) { toast('Some selections exceed budget. Share with Chris instead.'); return; }
  const allGov = GOVERNANCE_CHECKS.every(g => t.governance[g.id] || g.id === 'visaSecured' && !t.trip.visa);
  if (t.trip.visa && !t.governance.visaSecured) { toast('Visa must be secured before confirming.'); return; }
  t.status = 'confirmed';
  t.governance.budgetAligned = true;
  toast('Ticket confirmed and shared with traveler.');
  render();
}

function chrisApprove(ticketId) {
  const t = getTicket(ticketId);
  t.chrisDecision = 'approved';
  t.status = 'approved';
  t.governance.withinCostBand = true;
  t.governance.budgetAligned = true;
  toast('Chris approved — agent may proceed with booking.');
  render();
}

function chrisReject(ticketId) {
  const t = getTicket(ticketId);
  t.chrisDecision = 'rejected';
  t.status = 'quoting';
  t.sharedWithChris = false;
  toast('Chris rejected — returned to agent for new options.');
  render();
}

function createTicket(e) {
  e.preventDefault();
  const f = e.target;
  const id = 'TKT-' + String(tickets.length + 1).padStart(3, '0');
  const budgetMax = parseInt(f.budgetMax.value);
  const visaRequired = f.visa.value === 'yes';
  const ticket = {
    id, scenario: visaRequired ? 'Visa required — ticket created' : 'New ticket', status: visaRequired ? 'locked' : 'quoting',
    traveler: { name: f.name.value, age: parseInt(f.age.value), email: f.email.value, dept: f.dept.value, deptHead: f.deptHead.value },
    trip: { from: f.from.value, to: f.to.value, purpose: f.purpose.value, project: f.project.value, depart: f.depart.value, return: f.returnDate.value, departTime: f.departTime.value, returnTime: f.returnTime.value, hotel: f.hotel.value, car: f.car.value, visa: visaRequired, urgent: f.urgent.checked, travelClass: f.travelClass.value },
    budget: { min: parseInt(f.budgetMin.value), max: budgetMax, region: f.region.value },
    agentId: 'a1', matrix: null, selectedCells: {},
    governance: { ...GOV_DEFAULTS, chrisEmailApproval: false, formSourceOfTruth: true, visaSecured: !visaRequired },
    sharedWithChris: false, chrisDecision: null, notes: visaRequired ? 'Visa required — ticket created. No booking steps until visa secured.' : 'Ticket created — agent to add vendor price matrix.',
  };
  tickets.unshift(ticket);
  toast(visaRequired ? 'Ticket ' + id + ' created. Visa must be secured before agent adds quotes.' : 'Ticket ' + id + ' created. Agent can now add the price matrix.');
  selectedTicketId = id;
  view = 'detail';
  render();
}

function addAgent() {
  const name = prompt('Agent name:');
  const email = prompt('Agent email:');
  if (name && email) {
    agents.push({ id: 'a' + Date.now(), name, email, active: true, tickets: 0 });
    toast('Agent added.');
    render();
  }
}

function toggleAgent(id) {
  const a = agents.find(x => x.id === id);
  if (a) { a.active = !a.active; render(); }
}

function deleteAgent(id) {
  if (confirm('Remove this agent?')) {
    agents = agents.filter(x => x.id !== id);
    render();
  }
}

function render() {
  const main = document.getElementById('main-content');
  if (currentUser.role === 'chris') renderChris(main);
  else if (currentUser.role === 'hr') renderHR(main);
  else if (currentUser.role === 'agent') renderAgent(main);
  else renderSA(main);
}

  if (view === 'detail' && selectedTicketId) {
    const t = getTicket(selectedTicketId);
    ensureGov(t);
    const visaPending = t.trip.visa && !hrVisaChecksComplete(t);
    main.innerHTML = `
      <div class="back-link" onclick="view='list';selectedTicketId=null;render()">← Back to governance queue</div>
      ${t.trip.visa ? `<div class="alert ${visaPending ? 'alert-warn' : 'alert-success'}"><strong>Visa Required — Yes.</strong> ${visaPending ? 'HR must complete all visa checks and mark <em>Visa permitted to proceed</em> before the travel desk can book.' : 'All HR visa checks complete — travel desk may proceed once visa is secured.'}</div>` : ''}
      <div class="card">
        <div class="card-header"><h2>${t.id} — ${t.traveler.name}</h2>${statusBadge(t.status)} ${t.trip.visa ? '<span class="badge badge-hr">Visa case</span>' : ''}</div>
        <div class="card-body">
          <div class="alert alert-info">HR governance and oversight — program owner: Melissa Payumo. HR monitors compliance; does not coordinate every booking email.</div>
          <div class="detail-meta">
            <div class="meta-item"><div class="k">Traveler</div><div class="v">${t.traveler.name}</div></div>
            <div class="meta-item"><div class="k">Department</div><div class="v">${t.traveler.dept || '—'}</div></div>
            <div class="meta-item"><div class="k">Route</div><div class="v">${t.trip.from} → ${t.trip.to}</div></div>
            <div class="meta-item"><div class="k">Visa Required</div><div class="v">${t.trip.visa ? 'Yes' : 'No'}</div></div>
            <div class="meta-item"><div class="k">Region / Band</div><div class="v">${t.budget.region}</div></div>
            <div class="meta-item"><div class="k">Scenario</div><div class="v">${t.scenario}</div></div>
          </div>
          <h3 style="margin-bottom:12px">HR Governance Checks</h3>
          ${renderHRGovernance(t, true)}
        </div>
      </div>`;
    return;
  }

  const visaQueue = tickets.filter(t => t.trip.visa && !hrVisaChecksComplete(t));
  const bandQueue = tickets.filter(t => isOverBand(t) && !t.governance.bandBreachReviewed);
  const profileQueue = tickets.filter(t => !t.governance.profileAccurate);

  main.innerHTML = `
    <div class="stats-row">
      <div class="stat-card"><div class="label">Visa — HR Action</div><div class="value">${visaQueue.length}</div></div>
      <div class="stat-card"><div class="label">Over-Band Review</div><div class="value">${bandQueue.length}</div></div>
      <div class="stat-card"><div class="label">Profile Issues</div><div class="value">${profileQueue.length}</div></div>
      <div class="stat-card"><div class="label">All Tickets</div><div class="value">${tickets.length}</div></div>
    </div>
    <div class="card">
      <div class="card-header"><h2>HR Governance Queue</h2><span class="badge badge-hr">Melissa Payumo — Program Owner</span></div>
      <div class="card-body" style="padding:0">
        <table>
          <thead><tr><th>Ticket</th><th>Traveler</th><th>Route</th><th>Visa</th><th>HR Status</th><th>Ticket Status</th></tr></thead>
          <tbody>
            ${tickets.map(t => {
              ensureGov(t);
              const visaFlag = t.trip.visa ? (hrVisaChecksComplete(t) ? '✓ Visa OK' : '🔒 Visa pending') : '—';
              const hrPending = (t.trip.visa && !hrVisaChecksComplete(t)) || (isOverBand(t) && !t.governance.bandBreachReviewed) || !t.governance.profileAccurate;
              return `<tr class="clickable-row" onclick="selectedTicketId='${t.id}';view='detail';render()">
                <td><strong>${t.id}</strong></td>
                <td>${t.traveler.name}</td>
                <td>${t.trip.from} → ${t.trip.to}</td>
                <td>${visaFlag}</td>
                <td>${hrPending ? '<span class="badge badge-pending-chris">Action needed</span>' : '<span class="badge badge-approved">Clear</span>'}</td>
                <td>${statusBadge(t.status)}</td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>
    </div>`;
}

function renderChris(main) {
  if (view === 'detail' && selectedTicketId) {
    const t = getTicket(selectedTicketId);
    main.innerHTML = `
      <div class="back-link" onclick="view='list';selectedTicketId=null;render()">← Back to inbox</div>
      <div class="card">
        <div class="card-header"><h2>${t.id} — ${t.traveler.name}</h2>${statusBadge(t.status)}</div>
        <div class="card-body">
          <div class="alert alert-info">Agent shared selected flight options for your review. You see only the fares the agent chose — not the full vendor price matrix.</div>
          <div class="detail-meta">
            <div class="meta-item"><div class="k">Route</div><div class="v">${t.trip.from} → ${t.trip.to}</div></div>
            <div class="meta-item"><div class="k">Budget Range</div><div class="v">AED ${t.budget.min.toLocaleString()} – ${t.budget.max.toLocaleString()}</div></div>
            <div class="meta-item"><div class="k">Region / Band</div><div class="v">${t.budget.region}</div></div>
            <div class="meta-item"><div class="k">Scenario</div><div class="v">${t.scenario}</div></div>
            <div class="meta-item"><div class="k">Visa Required</div><div class="v">${t.trip.visa ? 'Yes' : 'No'}</div></div>
            <div class="meta-item"><div class="k">Travel Class</div><div class="v">${t.trip.travelClass}</div></div>
          </div>
          <h3 style="margin-bottom:12px">Agency × Flight — Agent-Selected Options</h3>
          ${renderChrisSelectedOptions(t)}
          <h3 style="margin:24px 0 12px">Governance Checks</h3>
          <div class="gov-list">${renderGovernance(t, false)}</div>
          ${t.status === 'pending-chris' ? `
          <div class="action-bar">
            <button class="btn btn-success" onclick="chrisApprove('${t.id}')">✓ Approve & Proceed</button>
            <button class="btn btn-secondary" onclick="chrisReject('${t.id}')">✕ Reject — Request New Options</button>
          </div>` : t.chrisDecision === 'approved' ? '<div class="alert alert-success">You approved this ticket.</div>' : ''}
        </div>
      </div>`;
    return;
  }
  const pending = tickets.filter(t => t.sharedWithChris && !t.chrisDecision);
  const all = tickets.filter(t => t.sharedWithChris || t.status === 'pending-chris');
  main.innerHTML = `
    <div class="stats-row">
      <div class="stat-card"><div class="label">Pending Review</div><div class="value">${pending.length}</div></div>
      <div class="stat-card"><div class="label">Approved Today</div><div class="value">${tickets.filter(t => t.chrisDecision === 'approved').length}</div></div>
      <div class="stat-card"><div class="label">Total Tickets</div><div class="value">${tickets.length}</div></div>
    </div>
    <div class="card">
      <div class="card-header"><h2>Approval Inbox</h2><span class="badge badge-pending-chris">${pending.length} awaiting</span></div>
      <div class="card-body" style="padding:0">
        <table>
          <thead><tr><th>Ticket</th><th>Traveler</th><th>Route</th><th>Budget</th><th>Scenario</th><th>Status</th><th></th></tr></thead>
          <tbody>
            ${pending.length ? pending.map(t => `
              <tr class="clickable-row" onclick="selectedTicketId='${t.id}';view='detail';render()">
                <td><strong>${t.id}</strong></td>
                <td>${t.traveler.name}</td>
                <td>${t.trip.from} → ${t.trip.to}</td>
                <td>AED ${t.budget.min.toLocaleString()}–${t.budget.max.toLocaleString()}</td>
                <td>${t.scenario}</td>
                <td>${statusBadge(t.status)}</td>
                <td><button class="btn btn-primary btn-sm">Review</button></td>
              </tr>`).join('') : '<tr><td colspan="7" class="empty-state">No tickets pending your approval</td></tr>'}
          </tbody>
        </table>
      </div>
    </div>
    <div class="card">
      <div class="card-header"><h2>All Shared Tickets</h2></div>
      <div class="card-body" style="padding:0">
        <table>
          <thead><tr><th>Ticket</th><th>Traveler</th><th>Decision</th><th>Status</th></tr></thead>
          <tbody>
            ${all.map(t => `<tr class="clickable-row" onclick="selectedTicketId='${t.id}';view='detail';render()">
              <td>${t.id}</td><td>${t.traveler.name}</td>
              <td>${t.chrisDecision ? (t.chrisDecision === 'approved' ? '✓ Approved' : '✕ Rejected') : '—'}</td>
              <td>${statusBadge(t.status)}</td></tr>`).join('')}
          </tbody>
        </table>
      </div>
    </div>`;
}

function renderAgent(main) {
  if (view === 'create') {
    main.innerHTML = `
      <div class="back-link" onclick="view='list';render()">← Back to tickets</div>
      <div class="card">
        <div class="card-header"><h2>Create Travel Ticket</h2></div>
        <div class="card-body">
          <form onsubmit="createTicket(event)">
            <div class="form-grid">
              <div class="form-field"><label>Traveler Name *</label><input name="name" required></div>
              <div class="form-field"><label>Age *</label><input name="age" type="number" required></div>
              <div class="form-field"><label>Email *</label><input name="email" type="email" required></div>
              <div class="form-field"><label>Department</label><input name="dept"></div>
              <div class="form-field"><label>Department Head</label><input name="deptHead"></div>
              <div class="form-field"><label>From *</label><input name="from" required placeholder="Dubai (DXB)"></div>
              <div class="form-field"><label>To *</label><input name="to" required placeholder="Amsterdam (AMS)"></div>
              <div class="form-field"><label>Purpose of Travel</label><input name="purpose"></div>
              <div class="form-field"><label>Project / Client</label><input name="project"></div>
              <div class="form-field"><label>Departure Date</label><input name="depart" type="date"></div>
              <div class="form-field"><label>Return Date</label><input name="returnDate" type="date"></div>
              <div class="form-field"><label>Preferred Departure Time</label><input name="departTime" placeholder="Late afternoon"></div>
              <div class="form-field"><label>Preferred Return Time</label><input name="returnTime" placeholder="Afternoon"></div>
              <div class="form-field"><label>Hotel Requirement</label><input name="hotel" placeholder="Yes — location"></div>
              <div class="form-field"><label>Car / Transport</label><input name="car" placeholder="No"></div>
              <div class="form-field"><label>Visa Required</label><select name="visa"><option value="no">No</option><option value="yes">Yes — ticket only until visa secured</option></select></div>
              <div class="form-field"><label>Travel Class</label><select name="travelClass"><option>Economy</option><option>Premium Economy</option><option>Business</option></select></div>
              <div class="form-field"><label>Region (Cost Band)</label><select name="region"><option>GCC</option><option>Europe</option><option>Asia</option><option>Rest of World</option></select></div>
              <div class="form-field"><label>Budget Min (AED)</label><input name="budgetMin" type="number" value="3000"></div>
              <div class="form-field"><label>Budget Max (AED) *</label><input name="budgetMax" type="number" required value="5000"></div>
              <div class="form-field"><label><input type="checkbox" name="urgent"> Urgent travel</label></div>
            </div>
            <div class="action-bar"><button type="submit" class="btn btn-primary">Create Ticket</button></div>
          </form>
        </div>
      </div>`;
    return;
  }

  if (view === 'detail' && selectedTicketId) {
    const t = getTicket(selectedTicketId);
    const visaBlocked = isVisaBlocked(t);
    const canAct = !visaBlocked && t.status !== 'locked' && t.status !== 'confirmed';
    const withinAll = allSelectedWithinBudget(t);
    main.innerHTML = `
      <div class="back-link" onclick="view='list';selectedTicketId=null;render()">← Back to tickets</div>
      ${visaBlocked ? '<div class="alert alert-warn"><strong>Visa Required — Ticket Created Only.</strong> Visa is not secured. No vendor quotes, no booking, and no further steps until visa is marked secured in governance checks.</div>' : ''}
      <div class="detail-grid">
        <div>
          <div class="card">
            <div class="card-header"><h2>${t.id} — ${t.traveler.name}</h2>${statusBadge(t.status)} ${t.trip.urgent ? '<span class="badge badge-urgent">URGENT</span>' : ''}</div>
            <div class="card-body">
              <div class="detail-meta">
                <div class="meta-item"><div class="k">Email</div><div class="v">${t.traveler.email}</div></div>
                <div class="meta-item"><div class="k">Age</div><div class="v">${t.traveler.age}</div></div>
                <div class="meta-item"><div class="k">Route</div><div class="v">${t.trip.from} → ${t.trip.to}</div></div>
                <div class="meta-item"><div class="k">Dates</div><div class="v">${t.trip.depart} → ${t.trip.return}</div></div>
                <div class="meta-item"><div class="k">Budget</div><div class="v">AED ${t.budget.min.toLocaleString()} – ${t.budget.max.toLocaleString()}</div></div>
                <div class="meta-item"><div class="k">Project</div><div class="v">${t.trip.project}</div></div>
                <div class="meta-item"><div class="k">Visa</div><div class="v">${t.trip.visa ? (t.governance.visaPermitted && t.governance.visaSecured ? 'Required — permitted & secured' : t.governance.visaPermitted ? 'Required — HR permitted, desk pending' : 'Required — HR action pending') : 'Not required'}</div></div>
                <div class="meta-item"><div class="k">Class</div><div class="v">${t.trip.travelClass}</div></div>
              </div>
              <p style="font-size:13px;color:#64748b;margin-bottom:16px"><strong>Scenario:</strong> ${t.scenario} · ${t.notes}</p>
              ${visaBlocked ? `
                <div class="empty-state" style="padding:32px;background:#fef2f2;border-radius:8px;border:1px solid #fecaca">
                  <strong style="color:#b91c1c">Booking workflow stopped</strong><br><br>
                  Ticket has been created and recorded. Because visa is required and HR has not yet permitted travel, the agent cannot add vendor prices, share options with Chris, or confirm any booking.<br><br>
                  HR (Melissa Payumo) must complete NOC, salary certificate, document checks, and mark <strong>Visa permitted to proceed</strong>. Then the travel desk marks <strong>Visa secured</strong> to unlock booking.
                </div>` : `
              <h3 style="margin-bottom:8px">Agency × Flight Price Matrix</h3>
              <p style="font-size:13px;color:#64748b;margin-bottom:12px">${t.matrix ? 'Enter vendor quotes from each agency, then select options to share. Green = within budget (≤ AED ' + t.budget.max.toLocaleString() + '). Red = over budget.' : 'Agent collects quotes from travel agencies and adds the price matrix here before any booking step.'}</p>
              ${renderMatrix(t, { selectable: canAct && matrixHasQuotes(t), editablePrices: canAct })}
              ${canAct && matrixHasQuotes(t) ? `<div class="action-bar">
                <button class="btn btn-success" onclick="agentConfirmTraveler('${t.id}')" ${!withinAll ? 'disabled title="Selections exceed budget"' : ''}>✓ Confirm & Share with Traveler</button>
                <button class="btn btn-warning" onclick="agentShareWithChris('${t.id}')">Share Selected with Chris</button>
              </div>
              <p style="font-size:12px;color:#64748b;margin-top:8px">Within budget → confirm directly. Over budget → share with Chris for approval.</p>` : canAct && !t.matrix ? '' : canAct ? '<p style="font-size:12px;color:#64748b;margin-top:8px">Enter at least one vendor quote to enable sharing.</p>' : ''}`}
            </div>
          </div>
        </div>
        <div>
          <div class="card">
            <div class="card-header"><h2>Governance Checks</h2></div>
            <div class="card-body"><div class="gov-list">${renderGovernance(t, visaBlocked ? 'visa-only' : canAct)}</div></div>
          </div>
          <div class="card">
            <div class="card-header"><h2>Trip Details</h2></div>
            <div class="card-body" style="font-size:14px;line-height:1.8">
              <div><strong>Purpose:</strong> ${t.trip.purpose}</div>
              <div><strong>Hotel:</strong> ${t.trip.hotel}</div>
              <div><strong>Car:</strong> ${t.trip.car}</div>
              <div><strong>Departure pref:</strong> ${t.trip.departTime}</div>
              <div><strong>Return pref:</strong> ${t.trip.returnTime}</div>
              <div><strong>Dept Head:</strong> ${t.traveler.deptHead}</div>
            </div>
          </div>
        </div>
      </div>`;
    return;
  }

  main.innerHTML = `
    <div class="stats-row">
      <div class="stat-card"><div class="label">My Tickets</div><div class="value">${tickets.length}</div></div>
      <div class="stat-card"><div class="label">Quoting</div><div class="value">${tickets.filter(t => t.status === 'quoting').length}</div></div>
      <div class="stat-card"><div class="label">Pending Chris</div><div class="value">${tickets.filter(t => t.status === 'pending-chris').length}</div></div>
      <div class="stat-card"><div class="label">Confirmed</div><div class="value">${tickets.filter(t => t.status === 'confirmed').length}</div></div>
    </div>
    <div class="card">
      <div class="card-header">
        <h2>Travel Tickets</h2>
        <button class="btn btn-primary btn-sm" onclick="view='create';render()">+ Create Ticket</button>
      </div>
      <div class="card-body" style="padding:0">
        <table>
          <thead><tr><th>Ticket</th><th>Traveler</th><th>Route</th><th>Budget Max</th><th>Scenario</th><th>Visa</th><th>Status</th></tr></thead>
          <tbody>
            ${tickets.map(t => `
              <tr class="clickable-row" onclick="selectedTicketId='${t.id}';view='detail';render()">
                <td><strong>${t.id}</strong></td>
                <td>${t.traveler.name}</td>
                <td>${t.trip.from} → ${t.trip.to}</td>
                <td>AED ${t.budget.max.toLocaleString()}</td>
                <td>${t.scenario}</td>
                <td>${t.trip.visa ? '🔒 Yes' : 'No'}</td>
                <td>${statusBadge(t.status)}</td>
              </tr>`).join('')}
          </tbody>
        </table>
      </div>
    </div>`;
}

function renderSA(main) {
  if (view === 'detail' && selectedTicketId) {
    const t = getTicket(selectedTicketId);
    const ag = agents.find(a => a.id === t.agentId);
    const visaBlocked = isVisaBlocked(t);
    main.innerHTML = `
      <div class="back-link" onclick="view='list';selectedTicketId=null;render()">← Back to overview</div>
      ${visaBlocked ? '<div class="alert alert-warn"><strong>Visa Required — Ticket Created Only.</strong> No booking workflow until visa is secured.</div>' : ''}
      <div class="card">
        <div class="card-header"><h2>${t.id} — ${t.traveler.name}</h2>${statusBadge(t.status)}</div>
        <div class="card-body">
          <div class="alert alert-info">${visaBlocked ? 'Super Admin view — ticket recorded. Booking locked pending visa.' : 'Super Admin view — full agency × flight price matrix (all vendor quotes).'}</div>
          <div class="detail-meta">
            <div class="meta-item"><div class="k">Agent</div><div class="v">${ag?.name || '—'}</div></div>
            <div class="meta-item"><div class="k">Route</div><div class="v">${t.trip.from} → ${t.trip.to}</div></div>
            <div class="meta-item"><div class="k">Budget</div><div class="v">AED ${t.budget.min.toLocaleString()} – ${t.budget.max.toLocaleString()}</div></div>
            <div class="meta-item"><div class="k">Scenario</div><div class="v">${t.scenario}</div></div>
          </div>
          <h3 style="margin-bottom:12px">Full Vendor × Flight Price Matrix</h3>
          <p style="font-size:13px;color:#64748b;margin-bottom:12px">All agency quotes. Selected cells marked with ★ (what Chris sees).</p>
          ${renderMatrix(t, { selectable: false })}
          <h3 style="margin:24px 0 12px">Governance Checks</h3>
          <div class="gov-list">${renderGovernance(t, false)}</div>
        </div>
      </div>`;
    return;
  }

  main.innerHTML = `
    <div class="stats-row">
      <div class="stat-card"><div class="label">Active Agents</div><div class="value">${agents.filter(a => a.active).length}</div></div>
      <div class="stat-card"><div class="label">Total Tickets</div><div class="value">${tickets.length}</div></div>
      <div class="stat-card"><div class="label">Confirmed</div><div class="value">${tickets.filter(t => t.status === 'confirmed').length}</div></div>
    </div>
    <div class="card">
      <div class="card-header">
        <h2>Manage Agents</h2>
        <button class="btn btn-primary btn-sm" onclick="addAgent()">+ Add Agent</button>
      </div>
      <div class="card-body" style="padding:0">
        <table>
          <thead><tr><th>Name</th><th>Email</th><th>Tickets Handled</th><th>Status</th><th>Actions</th></tr></thead>
          <tbody>
            ${agents.map(a => `
              <tr>
                <td><strong>${a.name}</strong></td>
                <td>${a.email}</td>
                <td>${a.tickets}</td>
                <td>${a.active ? '<span class="badge badge-approved">Active</span>' : '<span class="badge badge-draft">Inactive</span>'}</td>
                <td>
                  <button class="btn btn-secondary btn-sm" onclick="toggleAgent('${a.id}')">${a.active ? 'Deactivate' : 'Activate'}</button>
                  <button class="btn btn-secondary btn-sm" onclick="deleteAgent('${a.id}')">Remove</button>
                </td>
              </tr>`).join('')}
          </tbody>
        </table>
      </div>
    </div>
    <div class="card">
      <div class="card-header"><h2>All Tickets Overview</h2></div>
      <div class="card-body" style="padding:0">
        <table>
          <thead><tr><th>Ticket</th><th>Traveler</th><th>Agent</th><th>Scenario</th><th>Status</th></tr></thead>
          <tbody>
            ${tickets.map(t => {
              const ag = agents.find(a => a.id === t.agentId);
              return `<tr class="clickable-row" onclick="selectedTicketId='${t.id}';view='detail';render()"><td>${t.id}</td><td>${t.traveler.name}</td><td>${ag?.name || '—'}</td><td>${t.scenario}</td><td>${statusBadge(t.status)}</td></tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>
    </div>`;
}
</script>
</body>
</html>
